  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const cat = getCategory("math");
      document.getElementById("cat-code").innerHTML = `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${cat.icon}</svg>`;

      // Card grid stays JS-rendered (interactive live-readout preview, same
      // as the homepage) but is NOT the page's static SEO content — the h1,
      // description, and breadcrumb above are baked directly into the HTML
      // at build time (see build.js), not set here.
      const tools = calculatorsInCategory(cat.id);
      const translatedIds = {"percentage-calculator":true,"average-calculator":true,"mortgage-calculator":true,"loan-calculator":true,"compound-interest-calculator":true,"concrete-calculator":true,"flooring-calculator":true,"calorie-calculator":true,"bmi-calculator":true,"bmr-calculator":true,"age-calculator":true,"days-until-calculator":true,"unit-length-converter":true,"temperature-converter":true,"word-counter":true,"case-converter":true,"dog-age-calculator":true,"cat-age-calculator":true};
      const grid = document.getElementById("cat-tool-grid");
      tools.forEach((calc, i) => {
        const sampleResult = calc.compute(
          Object.fromEntries(calc.fields.map((f) => [f.id, f.type === "checkbox-group" ? (f.default || []) : f.default]))
        );
        const a = document.createElement("a");
        // Locale pages only have a localized tool page for the wave-one
        // batch — link straight through to it when it exists, otherwise
        // fall back to the English canonical rather than a 404.
        a.href = translatedIds[calc.id] ? `/es/tool/${calc.id}.html` : `https://calquary.com/tool/${calc.id}.html`;
        a.className = "tool-card";
        a.innerHTML = `
          <div class="cat-label">${calc.keyword}</div>
          <h3>${calc.title}</h3>
          <div class="readout">
            <span class="rlabel">${sampleResult.primary.label}</span>
            <span class="rvalue" style="--delay:${0.05 * i}s">${sampleResult.primary.value}</span>
          </div>
        `;
        grid.appendChild(a);
      });
    });
  </script>
