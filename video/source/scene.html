<script>
// ---------- deterministic RNG ----------
let seed = 1337;
function rnd(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }

const W = 1920, H = 1080, CX = W/2, CY = H/2;
const FOCAL = 1100;

// ---------- code text source ----------
const SNIPPETS = [

cin >> r1 >> c1;
while (c1 != r2) {

for (i = 0; i < r2; ++i)
    for (j = 0; j < columnSecond; ++j) {

multiplyMatrices(firstMatrix, secondMatrix, mult, r1, c1, r2, c2);
display(mult, r1, c2);`,

for (const key of Object.keys(config)) {

for year in range(1, 31):

`float feet, inch;

cout << "Sum of distances = " << feet << " feet " << inch << " inches";`,
`0x7ffe4b2c  48 89 e5 41 57 41 56 41  55 41 54 53 48 83 ec 28
0x7ffe4b3c  89 7d cc 48 89 75 c0 8b  45 cc 83 f8 01 7e 22 48
0x7ffe4b4c  8b 45 c0 48 83 c0 08 48  8b 00 48 89 c7 e8 a1 fe
0x7ffe4b5c  ff ff 89 45 dc eb 07 c7  45 dc 0a 00 00 00 8b 45`,

const LINES = SNIPPETS.join('\n\n').split('\n');

// ---------- panel textures ----------
const COLORS = {
  white: ['#d6e2f0', '#7d8ea3'],
  cyan:  ['#72f7ff', '#22c2e0'],
  red:   ['#ff3d55', '#e0304e'],
  pink:  ['#ff9ad0', '#b85a9c'],
};

function makePanel(kind){
  const fs = 22, lh = 28;
  const nLines = 12 + Math.floor(rnd()*34);
  const start = Math.floor(rnd()*LINES.length);
  const cols = 34 + Math.floor(rnd()*30);
  const w = Math.ceil(cols*fs*0.6) + 20, h = nLines*lh + 20;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.font = `${fs}px "DejaVu Sans Mono", monospace`;
  g.textBaseline = 'top';
  const [main, dim] = COLORS[kind];
  for (let i=0;i<nLines;i++){
    let s = LINES[(start+i)%LINES.length];
    if (s.length > cols) s = s.slice(0, cols);
    // occasional highlighted row
    const hi = rnd() < 0.12;
    g.globalAlpha = hi ? 1 : 0.35 + rnd()*0.5;
    if (rnd() < 0.18) continue;
    g.fillStyle = hi ? main : (rnd()<0.75 ? main : dim);
    g.fillText(s, 10, 10 + i*lh);
  }
  return cv;
}

// Pre-generate a texture pool per colour
const POOL = {};
for (const k of Object.keys(COLORS)){
  POOL[k] = [];
  for (let i=0;i<22;i++) POOL[k].push(makePanel(k));
}

// ---------- scene ----------
const DEPTH = 6000;     // corridor length cycled
const panels = [];
const N = 260;
for (let i=0;i<N;i++){
  const side = rnd()<0.5 ? -1 : 1;
  // horizontal distance from corridor axis: keep a dark core in the middle
  const x = side * (190 + Math.pow(rnd(),0.75)*1150);
  const y = (rnd()*2-1) * 1000;
  const z = rnd()*DEPTH;
  const scale = 0.35 + rnd()*0.55;
  panels.push({side, x, y, z, scale, r: rnd(), idx: Math.floor(rnd()*22), streak: rnd()});
}

// colour mood over time: white -> cyan -> mixed -> red -> mixed
function kindFor(p, t){
  const u = Math.max(0, t) / DURATION;
  const r = p.r;
  let wW=1, wC=0.15, wR=0.08, wP=0.03;
  if (u > 0.15){ wC = 0.15 + Math.min(1,(u-0.15)/0.2)*0.55; }
  if (u > 0.45){ wR = 0.08 + Math.min(1,(u-0.45)/0.2)*0.6; wC *= 0.8; }
  if (u > 0.55){ wP = 0.12; }
  const tot = wW+wC+wR+wP;
  // use a stable random value per panel so colour shifts gradually
  const v = (r * 7.31 + Math.floor((p.z0Cycle||0))*0.37) % 1 * tot;
  if (v < wC) return 'cyan';
  if (v < wC+wR) return 'red';
  if (v < wC+wR+wP) return 'pink';
  return 'white';
}

const DURATION = 15;
const SPEED = 1000; // units per second
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const acc = document.createElement('canvas'); acc.width=W; acc.height=H;
const actx = acc.getContext('2d');
const bloom = document.createElement('canvas'); bloom.width=W/2; bloom.height=H/2;
const bctx = bloom.getContext('2d');

function camera(t){
  // gentle drift, sway and roll
  return {
    z: t*SPEED*(1 + 0.25*Math.sin(t*0.35)) ,
    x: Math.sin(t*0.42)*140,
    y: Math.sin(t*0.31+1.2)*90,
    roll: Math.sin(t*0.27)*0.06,
    yaw: Math.sin(t*0.21+0.5)*0.08,
  };
}

function drawScene(g, t, alpha){
  const cam = camera(t);
  const list = [];
  for (const p of panels){
    let rz = p.z - cam.z;
    const cyc = Math.floor(rz / DEPTH);
    rz = rz - cyc*DEPTH;                 // wrap into [0, DEPTH)
    if (rz < 30) continue;
    let x = p.x - cam.x, y = p.y - cam.y;
    // yaw approximation
    x += cam.yaw * rz;
    list.push({p, rz, x, y, cyc});
  }
  list.sort((a,b)=>b.rz-a.rz);
  g.save();
  g.translate(CX, CY);
  g.rotate(cam.roll);
  g.globalCompositeOperation = 'lighter';
  for (const it of list){
    const {p, rz, x, y} = it;
    p.z0Cycle = it.cyc;
    const s = FOCAL / rz;
    const tex = POOL[kindFor(p, t - (DEPTH - rz)/SPEED)][p.idx];
    const w = tex.width * p.scale * s, h = tex.height * p.scale * s;
    const sx = x*s, sy = y*s;
    if (sx + w < -W || sx - w > W || sy + h < -H || sy - h > H) continue;
    // fog: fade far, fade very near
    const far = Math.pow(Math.min(1, Math.max(0, 1 - (rz-1400)/4500)), 1.3);
    const near = Math.min(1, rz/300);
    let a = far*near * alpha;
    if (a <= 0.003) continue;
    g.globalAlpha = a;
    g.drawImage(tex, p.side<0 ? sx - w : sx, sy - h/2, w, h);
    // radial speed streaks for some panels
    if (p.streak > 0.55 && rz < 4000){
      const len = (1 - rz/4000) * 0.5;
      g.globalAlpha = a * 0.22;
      const s2 = FOCAL / (rz + 700);
      const w2 = tex.width*p.scale*s2, h2 = tex.height*p.scale*s2;
      g.drawImage(tex, p.side<0 ? x*s2 - w2 : x*s2, y*s2 - h2/2, w2, h2);
      g.globalAlpha = a * 0.12;
      const s3 = FOCAL / (rz + 1500);
      { const w3 = tex.width*p.scale*s3; g.drawImage(tex, p.side<0 ? x*s3 - w3 : x*s3, y*s3 - tex.height*p.scale*s3/2, w3, tex.height*p.scale*s3); }
    }
  }
  g.restore();
}

const SUB = 5;          // motion blur sub-frames
const FPS = 60;
window.renderFrame = function(frame){
  const t = frame / FPS;
  actx.globalCompositeOperation = 'source-over';
  actx.globalAlpha = 1;
  actx.fillStyle = '#000';
  actx.fillRect(0,0,W,H);
  const shutter = 1/FPS * 0.8;
  for (let i=0;i<SUB;i++){
    drawScene(actx, t + shutter*(i/SUB), 1/SUB);
  }

  // background gradient
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  const bg = ctx.createRadialGradient(CX, CY, 50, CX, CY, W*0.7);
  bg.addColorStop(0, '#020407');
  bg.addColorStop(0.5, '#05090f');
  bg.addColorStop(1, '#0a1220');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // bloom
  bctx.globalCompositeOperation = 'source-over';
  bctx.filter = 'none';
  bctx.clearRect(0,0,W/2,H/2);
  bctx.filter = 'blur(10px)';
  bctx.drawImage(acc, 0, 0, W/2, H/2);
  bctx.filter = 'none';

  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(acc, 0, 0);
  ctx.globalAlpha = 0.6;
  ctx.drawImage(acc, 0, 0);
  ctx.globalAlpha = 1.0;
  ctx.drawImage(bloom, 0, 0, W, H);
  ctx.globalAlpha = 1;

  // vignette
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(CX, CY, H*0.35, CX, CY, W*0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // fade in / out
  const fin = Math.min(1, t/0.6), fout = Math.min(1, (DURATION - t)/0.6);
  const f = Math.max(0, Math.min(fin, fout));
  if (f < 1){ ctx.fillStyle = `rgba(0,0,0,${1-f})`; ctx.fillRect(0,0,W,H); }
};
window.ready = true;
</script>
